server:
  port: 8080

spring:
  application:
    name: technotes-api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          # OAuth also emits CORS headers; browsers require a single origin value.
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          routes:
            - id: notes-service
              uri: ${NOTES_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/categories,/api/v1/categories/**,/api/v1/notes,/api/v1/notes/**,/api/v1/public/categories,/api/v1/public/notes,/api/v1/public/notes/**
            - id: user-profile
              uri: ${USER_OAUTH_SERVICE_URL:http://localhost:9000}
              predicates:
                - Path=/api/v1/users/me
                - Method=GET
          # Pass the original path, Bearer token and If-Match through unchanged.
          # Authentication and authorization remain in the downstream services.
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/api/v1/**]':
                allowedOrigins:
                  - ${UI_ORIGIN:http://localhost:5173}
                allowedMethods:
                  - GET
                  - POST
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - If-Match
                exposedHeaders:
                  - ETag
                  - Location
                allowCredentials: false
                maxAge: 3600

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
